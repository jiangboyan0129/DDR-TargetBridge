name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environment/requirements-core.txt
      - name: Install numerical dependencies
        run: python -m pip install -r environment/requirements-core.txt
      - name: Check dependency resolution
        run: python -m pip check
      - name: Verify public package and unit tests
        run: python tools/run.py verify
      - name: Deterministic downstream core smoke test
        run: python tools/run.py core --output .build/ci-core
